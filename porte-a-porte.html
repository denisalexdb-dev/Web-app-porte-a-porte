<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Porte à porte</title>
<link rel="stylesheet" href="lib/leaflet.css" />
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1c1d21; --muted:#6b7280; --line:#e5e7eb;
    --accent:#378ADD; --accent-bg:#e6f1fb;
    --interesse:#1D9E75; --visite:#378ADD; --absent:#EF9F27; --refus:#E24B4A; --todo:#f4f5f7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--bg);position:relative}
  header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;margin:0;font-weight:600;white-space:nowrap}
  .search{flex:1;min-width:70px;max-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
  .search:focus{outline:none;border-color:var(--accent)}
  header .stat{font-size:12px;color:var(--muted)}
  .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:0;background:none;padding:11px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .view{flex:1;overflow:auto;display:none}
  .view.active{display:block}
  #map{width:100%;height:100%}
  #mapWrap{position:relative;height:100%}
  .hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(28,29,33,.85);color:#fff;font-size:12px;padding:7px 12px;border-radius:20px;z-index:500;white-space:nowrap;pointer-events:none}
  .list{padding:12px}
  .bcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
  .bcard .row{display:flex;align-items:center;gap:10px}
  .bicon{width:38px;height:38px;border-radius:9px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .bcard .name{font-weight:600;font-size:15px;margin:0}
  .bcard .sub{font-size:12px;color:var(--muted);margin:2px 0 0}
  .bcard .count{margin-left:auto;text-align:right}
  .bcard .count b{font-size:17px}
  .bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:9px}
  .bar span{display:block;height:100%;background:var(--interesse)}
  .empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px}
  /* detail */
  .detail{padding:14px}
  .back{background:none;border:0;color:var(--accent);font-size:14px;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:4px;margin-bottom:6px}
  .floor{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .floor .lab{width:40px;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0}
  .addoor{width:26px;height:26px;flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:7px;color:var(--accent);font-size:18px;font-weight:600;line-height:1;cursor:pointer;padding:0}
  .addoor:active,.delfloor:active{transform:scale(.94)}
  .delfloor{width:26px;height:26px;flex-shrink:0;border:1px solid #f0b3b3;background:#fff;border-radius:7px;color:#E24B4A;font-size:17px;font-weight:600;line-height:1;cursor:pointer;padding:0;margin-left:6px}
  .doors{display:flex;gap:6px;flex:1}
  .door{flex:1;min-width:0;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;cursor:pointer;border:0;position:relative}
  .door.todo{background:var(--todo);border:1px dashed #cbd0d6;color:#9aa0a6}
  .door .note-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .sw{width:12px;height:12px;border-radius:3px}
  /* fab + buttons */
  .fab{position:absolute;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:28px;box-shadow:0 4px 14px rgba(55,138,221,.45);cursor:pointer;z-index:600;display:flex;align-items:center;justify-content:center}
  .btn{width:100%;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
  .btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:1000}
  .overlay.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 18px 24px;animation:up .2s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:0 0 14px;font-size:16px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;background:#fff}
  .statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .statusgrid button{padding:11px;border-radius:9px;border:2px solid transparent;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .sqbtn{flex:1;padding:11px 8px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-family:inherit;cursor:pointer;line-height:1.2}
  .sqbtn.sel{background:#EF9F27;color:#fff;border-color:#EF9F27;font-weight:600}
  .statusgrid button.sel{outline:3px solid rgba(0,0,0,.15)}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
  .metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .metric .n{font-size:26px;font-weight:600}
  .metric .l{font-size:12px;color:var(--muted);margin-top:2px}
  .metric .n small{font-size:14px;color:var(--muted);font-weight:400}
  /* pastilles de la carte */
  .pin-in{width:34px;height:34px;border-radius:50%;background:#EF9F27;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .15s}
  .pin.done .pin-in{background:#378ADD}
  .pin-in b{font-size:14px;margin-top:1px}
  .pin-in i{font-size:11px;font-weight:700;font-style:normal;margin-top:-2px;letter-spacing:.5px}
  .far .pin-in{transform:scale(.55)}
  .far .pin.cand{display:none}
  .cpop{text-align:center;font:13px sans-serif;min-width:130px}
  .cpop div{margin-top:8px}
  .cpop button{padding:7px 10px;margin:0 3px;border:1px solid #d5d8dd;border-radius:7px;background:#f4f5f7;font:inherit}
  .cpop button.ok{border:0;background:#378ADD;color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Porte à porte</h1>
    <input id="search" class="search" placeholder="N° + M/A — ex : 3M" inputmode="text"
           onkeydown="if(event.key==='Enter')goToCage()" oninput="this.style.borderColor=''" />
    <div class="stat" id="hstat"></div>
  </header>
  <div class="tabs">
    <button data-tab="map" class="active">Carte</button>
    <button data-tab="list">Bâtiments</button>
    <button data-tab="stats">Stats</button>
  </div>

  <div class="view active" id="view-map">
    <div id="mapWrap">
      <div id="map"></div>
      <div class="hint" id="hint">Touchez la carte pour ajouter un bâtiment</div>
    </div>
  </div>

  <div class="view" id="view-list">
    <div class="list" id="blist"></div>
  </div>

  <div class="view" id="view-stats">
    <div class="metrics" id="metrics"></div>
    <div style="padding:0 12px 20px">
      <button class="btn" onclick="exportCSV()">Exporter en CSV (Excel)</button>
      <button class="btn ghost" onclick="backupJSON()">💾 Sauvegarder (fichier)</button>
      <button class="btn ghost" onclick="document.getElementById('fileLoad').click()">📂 Charger une sauvegarde</button>
      <input type="file" id="fileLoad" accept=".json" style="display:none" onchange="restoreJSON(this)" />
      <button class="btn ghost" onclick="resetStates()">Réinitialiser les visites</button>
    </div>
  </div>

  <!-- detail bâtiment -->
  <div class="view" id="view-detail">
    <div class="detail" id="detail"></div>
  </div>
</div>

<!-- modal ajout cage d'escalier -->
<div class="overlay" id="ovBuilding">
  <div class="sheet">
    <h3>Nouvelle cage d'escalier</h3>
    <label>Square</label>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button type="button" id="sqM" class="sqbtn" onclick="pickSquare('M')">Square des Moulineaux</button>
      <button type="button" id="sqA" class="sqbtn" onclick="pickSquare('A')">Square de l'Avre</button>
    </div>
    <label>Numéro de la cage</label>
    <input id="fNum" type="number" min="1" />
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Nb d'étages</label><input id="fFloors" type="number" value="4" min="1" max="30" /></div>
      <div style="flex:1"><label>Portes / palier</label><input id="fDoors" type="number" value="2" min="1" max="12" /></div>
    </div>
    <button class="btn" onclick="createBuilding()">Ajouter</button>
    <button class="btn ghost" onclick="closeOv('ovBuilding')">Annuler</button>
  </div>
</div>

<!-- modal saisie porte -->
<div class="overlay" id="ovDoor">
  <div class="sheet">
    <h3 id="doorTitle">Porte</h3>
    <label>Statut</label>
    <div class="statusgrid" id="statusGrid"></div>
    <label>Note</label>
    <input id="fNote" placeholder="Repasser le soir, code 1234B…" onchange="if(curDoor){curDoor.d.note=this.value.trim();save();}" />
    <p style="font-size:12px;color:#6b7280;margin:2px 0 0">Touchez un statut pour enregistrer et revenir.</p>
    <button class="btn ghost" style="color:#E24B4A;border-color:#f0b3b3;margin-top:12px" onclick="deleteDoor()">Supprimer cette porte</button>
  </div>
</div>

<script src="lib/leaflet.js"></script>
<script src="data/buildings.js"></script>
<script>
const STATUSES = [
  {key:'todo',      label:'À faire',   color:'#9aa0a6'},
  {key:'interesse', label:'Intéressé', color:'#1D9E75'},
  {key:'visite',    label:'Visité',    color:'#378ADD'},
  {key:'absent',    label:'Absent',    color:'#EF9F27'},
  {key:'refus',     label:'Refus',     color:'#E24B4A'},
];
const STATUS_BY = Object.fromEntries(STATUSES.map(s=>[s.key,s]));
const colorOf = k => (STATUS_BY[k]||STATUSES[0]).color;
const labelOf = k => (STATUS_BY[k]||STATUSES[0]).label;

let DB;
try { DB = JSON.parse(localStorage.getItem('pap')||'null'); } catch(e){ DB = null; }
if(!DB || !Array.isArray(DB.buildings)) DB = {buildings:[]};
if(!DB.dismissed) DB.dismissed = [];   // entrées auto retirées à la main
function save(){ localStorage.setItem('pap', JSON.stringify(DB)); }
const findB = id => DB.buildings.find(b=>b.id===id);

let pendingLatLng = null;   // position de la cage en cours de création
let pendingSquare = 'M';
let curBuilding = null;     // cage ouverte dans le détail
let curDoor = null;         // {b, d}

/* ---------- Carte ---------- */
// Vue d'accueil : cadrage par 2 intersections, chacune posée sur un bord latéral
const EDGE_L = [48.8283903, 2.2505021]; // bord gauche : Rue de Seine × Avenue Pierre Grenier
const EDGE_R = [48.8281580, 2.2536653]; // bord droit  : Quai du Point du Jour × Rue Émile Duclaux
// Zone de déplacement autorisée : la cité + le rond-point du Pont de Sèvres (à l'ouest), avec un peu de marge
const ZONE = [[48.8255, 2.2265], [48.8315, 2.2545]];
let map = null, homeZoom = 0, markerLayer = null, outlineLayer = null;

// zoom qui fait tenir pile EDGE_L -> EDGE_R dans la largeur de l'écran
function homeView(){
  const crs = map.options.crs;
  const dx = crs.latLngToPoint(L.latLng(EDGE_R),0).x - crs.latLngToPoint(L.latLng(EDGE_L),0).x;
  return { center:[(EDGE_L[0]+EDGE_R[0])/2, (EDGE_L[1]+EDGE_R[1])/2], zoom:Math.log2(map.getSize().x/dx) };
}
// recalcule les limites (zoom mini + zone bloquée) ; recentre seulement si demandé
function frameMap(recenter){
  map.invalidateSize();
  const size = map.getSize(); if(!size.x || !size.y) return;   // onglet carte masqué
  const h = homeView(); homeZoom = h.zoom;
  // emprise de la vue d'accueil, pour qu'elle reste toujours atteignable en entier
  const c = map.project(h.center, h.zoom), half = size.divideBy(2);
  const area = L.latLngBounds(ZONE)
    .extend(map.unproject(c.subtract(half), h.zoom))
    .extend(map.unproject(c.add(half), h.zoom));
  map.setMaxBounds(null); map.setMinZoom(0);
  if(recenter || !map._loaded) map.setView(h.center, h.zoom, {animate:false});
  map.setMinZoom(map.getBoundsZoom(area));   // dézoom max = toute la zone visible
  map.setMaxBounds(area);                    // verrouille le déplacement sur la zone
  updateZoomClass();
}
// vue large : pastilles réduites, entrées "+" masquées
function updateZoomClass(){
  document.getElementById('map').classList.toggle('far', map.getZoom() < homeZoom - 0.8);
}
function goHome(){ const h = homeView(); map.flyTo(h.center, h.zoom, {duration:.5}); }

try {
  if(typeof L === 'undefined') throw new Error('Leaflet non chargé');
  map = L.map('map',{
    zoomControl:true,
    zoomSnap:0,               // zoom fractionnaire -> cadrage exact au pixel
    zoomDelta:0.5,
    maxBoundsViscosity:1.0,   // bord "dur" : la carte reste sur la zone
    preferCanvas:true         // contours d'immeubles en canvas, plus léger que le SVG
  });
  // Fond épuré sans pictos de commerces (rues + noms + bâtiments)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    maxZoom:22, maxNativeZoom:20, subdomains:'abcd', keepBuffer:4,
    attribution:'© OpenStreetMap © CARTO'
  }).addTo(map);
  // bouton ⌂ : revenir sur la cité
  const Home = L.Control.extend({ options:{position:'topleft'}, onAdd(){
    const el = L.DomUtil.create('div','leaflet-bar');
    el.innerHTML = '<a href="#" role="button" title="Recentrer sur la cité" style="font-size:16px">⌂</a>';
    L.DomEvent.on(el,'click',e=>{ L.DomEvent.stop(e); goHome(); });
    return el;
  }});
  map.addControl(new Home());
  frameMap(true);
  // resize (rotation, clavier mobile…) : on ajuste les limites sans faire sauter la vue
  let rzT; window.addEventListener('resize', ()=>{ clearTimeout(rzT); rzT = setTimeout(()=>frameMap(false), 150); });
  map.on('zoomend', updateZoomClass);
  // taper un porche manqué -> cage (seulement sur la cité, pas en vue large)
  map.on('click', e=>{ if(map.getZoom() >= homeZoom - 0.8) openCageModal(e.latlng.lat, e.latlng.lng, 4); });
  document.getElementById('hint').textContent = 'Touchez un porche pour ajouter une cage';
  setTimeout(()=>document.getElementById('hint').style.display='none', 6000);
} catch(err){
  map = null;
  document.getElementById('mapWrap').innerHTML =
    '<div class="empty">La carte n\'a pas pu se charger.<br>Utilise l\'onglet Bâtiments pour ajouter/gérer tes bâtiments.<br><br><button class="btn" style="max-width:240px;margin:0 auto" onclick="pendingLatLng=null;openOv(\'ovBuilding\')">+ Ajouter un bâtiment</button></div>';
}

/* ---------- Cages : numéro figé par square ---------- */
// M = Square des Moulineaux (nord), A = Square de l'Avre (sud)
const squareOf = lat => lat>48.8283 ? 'M' : 'A';
const SQNAME = {M:'Moulineaux', A:'Avre'};
// une cage est "faite" quand toutes ses portes ont été traitées
const cageDone = b => b.doors.length>0 && b.doors.every(d=>d.status!=='todo');
const doneCount = b => b.doors.reduce((n,d)=>n+(d.status!=='todo'),0);
// plus petit numéro libre dans un square
function nextCageNum(sq){
  const used = new Set(DB.buildings.filter(b=>b.sq===sq&&b.num).map(b=>b.num));
  let n=1; while(used.has(n)) n++; return n;
}
// attribue UNE FOIS un numéro figé aux cages qui n'en ont pas encore (migration + sécurité)
function ensureCageNumbers(){
  let changed=false; const g={M:[],A:[]};
  DB.buildings.forEach(b=>{ if(!b.sq){ b.sq=squareOf(b.lat); changed=true; } g[b.sq].push(b); });
  ['M','A'].forEach(sq=>{
    const used = new Set(g[sq].filter(b=>b.num).map(b=>b.num));
    g[sq].filter(b=>!b.num).sort((a,b)=> b.lat-a.lat || a.lng-b.lng).forEach(b=>{
      let n=1; while(used.has(n)) n++; b.num=n; used.add(n); changed=true;
    });
  });
  if(changed) save();
}
// numéros en double dans un même square -> ensemble de clés "sq-num"
function cageConflicts(){
  const seen=new Set(), dup=new Set();
  DB.buildings.forEach(b=>{ if(b.num){ const k=b.sq+'-'+b.num; if(seen.has(k)) dup.add(k); seen.add(k); } });
  return dup;
}
let conflicts = new Set();
function refreshNumbers(){ ensureCageNumbers(); conflicts = cageConflicts(); }
const isConflict = b => conflicts.has(b.sq+'-'+b.num);
// nom lisible d'une cage : "Cage 3 — Moulineaux" (astérisque si numéro en double)
const cageLabel = b => b.num ? `Cage ${b.num}${isConflict(b)?' *':''} — ${SQNAME[b.sq]}` : (b.addr||'Cage');

/* ---------- Contours immeubles + détection des cages d'escalier ---------- */
const DET = {apexMin:1.5, apexMax:12, flank:7, conv:50, merge:6, minArea:250};
let buildingsData = window.BUILDINGS_DATA || null;
let candidates = null;   // entrées détectées, calculées une seule fois (la géométrie ne bouge pas)

function projM(coords){
  const lat0=coords[0][0]*Math.PI/180, mLat=111320, mLon=111320*Math.cos(lat0);
  const p=coords.map(([la,lo])=>[(lo-coords[0][1])*mLon,(la-coords[0][0])*mLat]);
  if(p.length>1){ const a=p[0],z=p[p.length-1]; if(Math.hypot(a[0]-z[0],a[1]-z[1])<0.01) p.pop(); }
  return {p,mLat,mLon};
}
function signedArea(p){
  let a=0; const n=p.length;
  for(let i=0;i<n;i++){ const[x1,y1]=p[i],[x2,y2]=p[(i+1)%n]; a+=x1*y2-x2*y1; }
  return a/2;
}
// Détecte les entrées (redans) -> [[lat,lon],...]
function detectEntrances(coords){
  const {p,mLat,mLon}=projM(coords); const n=p.length;
  if(n<6 || Math.abs(signedArea(p))<DET.minArea) return [];
  const ccw=signedArea(p)>0;
  const len=i=>{const[x1,y1]=p[i],[x2,y2]=p[(i+1)%n];return Math.hypot(x2-x1,y2-y1);};
  const turn=i=>{const a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n];
    const ax=b[0]-a[0],ay=b[1]-a[1],bx=c[0]-b[0],by=c[1]-b[1];
    const t=Math.atan2(ax*by-ay*bx,ax*bx+ay*by)*180/Math.PI; return ccw?t:-t;};
  const cand=[];
  for(let i=0;i<n;i++){
    const eLen=len(i); if(eLen<DET.apexMin||eLen>DET.apexMax) continue;
    if(turn(i)<DET.conv||turn((i+1)%n)<DET.conv) continue;              // deux coins convexes
    if(len((i-1+n)%n)>DET.flank||len((i+1)%n)>DET.flank) continue;      // côtés = profondeur du porche
    const a=p[i],b=p[(i+1)%n], mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    const dx=(b[0]-a[0])/eLen, dy=(b[1]-a[1])/eLen;
    const nx=ccw?dy:-dy, ny=ccw?-dx:dx;                                 // normale extérieure
    const e=[mx+nx*1.6, my+ny*1.6];
    if(!cand.some(m=>Math.hypot(m[0]-e[0],m[1]-e[1])<DET.merge)) cand.push(e);
  }
  return cand.map(e=>[coords[0][0]+e[1]/mLat, coords[0][1]+e[0]/mLon]);
}
function getCandidates(){
  if(!candidates && buildingsData)
    candidates = buildingsData.flatMap(bd=>detectEntrances(bd.coords).map(pt=>({lat:pt[0],lng:pt[1],levels:bd.levels||4})));
  return candidates || [];
}
function nearM(lat1,lng1,lat2,lng2,m){
  const mLon=111320*Math.cos(lat2*Math.PI/180);
  return Math.hypot((lat1-lat2)*111320,(lng1-lng2)*mLon)<m;
}
const isCage = c => DB.buildings.some(b=>b.lat!=null && nearM(c.lat,c.lng,b.lat,b.lng,5));
const isDismissed = c => DB.dismissed.some(d=>nearM(c.lat,c.lng,d[0],d[1],5));

// dessine les contours une seule fois
function ensureOutlines(){
  if(!map || outlineLayer || !buildingsData) return;
  outlineLayer = L.layerGroup(buildingsData.map(b=>L.polygon(b.coords,
    {color:'#5b6b7a',weight:1,fillColor:'#5b6b7a',fillOpacity:0.06,interactive:false}))).addTo(map);
}
function pastilleIcon(text, sq, cls){
  return L.divIcon({className:'pin '+cls, iconSize:[34,34], iconAnchor:[17,17],
    html:`<div class="pin-in"><b>${text}</b><i>${sq}</i></div>`});
}
// dessine TOUT : cages (numéro figé, bleu = faite / orange = pas faite) + entrées détectées ("+")
function drawMarkers(){
  if(!map) return;
  ensureOutlines();
  const ms=[];
  DB.buildings.forEach(b=>{
    if(b.lat==null) return;
    const m=L.marker([b.lat,b.lng],{icon:pastilleIcon(b.num+(isConflict(b)?'*':''), b.sq, cageDone(b)?'done':'todo')});
    m.on('click',()=>openDetail(b.id)); ms.push(m);
  });
  getCandidates().forEach(c=>{
    if(isCage(c)||isDismissed(c)) return;
    ms.push(L.marker([c.lat,c.lng],{icon:pastilleIcon('+', squareOf(c.lat), 'todo cand')})
      .bindPopup(`<div class="cpop">Entrée de cage&nbsp;?<div>
        <button class="ok" onclick="openCageModal(${c.lat},${c.lng},${c.levels})">Créer</button>
        <button onclick="dismissCandidate(${c.lat},${c.lng})">Retirer</button></div></div>`));
  });
  if(markerLayer) map.removeLayer(markerLayer);
  markerLayer = L.layerGroup(ms).addTo(map);
}
// données des contours : intégrées (double-clic, sans serveur), sinon fichier json
if(map && !buildingsData)
  fetch('data/buildings.json').then(r=>r.json()).then(d=>{ buildingsData=d; drawMarkers(); }).catch(()=>{});

// ouvre la fenêtre "nouvelle cage" : square par défaut selon la position, numéro suggéré
function pickSquare(sq){
  pendingSquare=sq;
  document.getElementById('sqM').classList.toggle('sel', sq==='M');
  document.getElementById('sqA').classList.toggle('sel', sq==='A');
  document.getElementById('fNum').value = nextCageNum(sq);   // numéro suggéré = 1er libre
}
function openCageModal(lat,lng,levels){
  if(map) map.closePopup();
  pendingLatLng={lat,lng};
  pickSquare(squareOf(lat));
  document.getElementById('fFloors').value = levels||4;
  document.getElementById('fDoors').value = 2;
  openOv('ovBuilding');
}
// retirer définitivement une pastille auto erronée
function dismissCandidate(lat,lng){
  map.closePopup();
  DB.dismissed.push([lat,lng]); save(); drawMarkers();
}

/* ---------- Création / édition d'une cage ---------- */
const newDoor = (floor,index) => ({floor, index, status:'todo', note:'', date:'', by:''});
function createBuilding(){
  const nf = Math.max(1, +document.getElementById('fFloors').value||1);
  const nd = Math.max(1, +document.getElementById('fDoors').value||1);
  const ll = pendingLatLng || (map ? map.getCenter() : {lat:48.8283,lng:2.2521});
  const sq = pendingSquare;
  const num = Math.max(1, +document.getElementById('fNum').value || nextCageNum(sq));
  const doors = [];
  for(let f=0; f<nf; f++) for(let i=0; i<nd; i++) doors.push(newDoor(f,i));
  DB.buildings.push({id:'b'+Date.now(), addr:"Cage d'escalier", sector:'', floors:nf, perFloor:nd, lat:ll.lat, lng:ll.lng, sq, num, doors});
  save(); closeOv('ovBuilding'); render();
}
// toute modification d'une cage : sauvegarde + rafraîchit détail, carte et compteur
function commit(){ save(); refreshNumbers(); renderDetail(); drawMarkers(); updateHeader(); }
function setCageNum(id,val){
  const b=findB(id), n=parseInt(val,10); if(!b) return;
  if(n>0) b.num=n; commit();
}
function setCageSquare(id,sq){ const b=findB(id); if(b){ b.sq=sq; commit(); } }
function setCageNote(id,val){ const b=findB(id); if(b){ b.note=val; save(); } }
function addFloor(id){
  const b=findB(id); if(!b) return;
  const per=Math.max(1,b.perFloor||2);
  for(let i=0;i<per;i++) b.doors.push(newDoor(b.floors,i));
  b.floors++; commit();
}
function addDoorToFloor(id,floor){
  const b=findB(id); if(!b) return;
  const idxs=b.doors.filter(d=>d.floor===floor).map(d=>d.index);
  b.doors.push(newDoor(floor, idxs.length?Math.max(...idxs)+1:0)); commit();
}
function deleteFloor(id,floor){
  const b=findB(id); if(!b) return;
  if(b.floors<=1){ alert('Une cage doit garder au moins un étage.'); return; }
  if(!confirm('Êtes-vous sûr de vouloir supprimer cet étage ?')) return;
  b.doors = b.doors.filter(d=>d.floor!==floor);
  b.doors.forEach(d=>{ if(d.floor>floor) d.floor--; });   // décale les étages au-dessus
  b.floors--; commit();
}
function deleteBuilding(id){
  if(!confirm('Êtes-vous sûr de vouloir supprimer le bâtiment ?')) return;
  DB.buildings = DB.buildings.filter(b=>b.id!==id);
  curBuilding=null; save(); setTab('list'); render();
}

/* ---------- Détail d'une cage ---------- */
function openDetail(id){
  curBuilding = findB(id);
  setTab('detail'); renderDetail();
}
// recherche "3M" / "5 A" -> ouvre la cage n°3 du square M
function goToCage(){
  const el=document.getElementById('search');
  const v=(el.value||'').toUpperCase();
  const num=parseInt((v.match(/\d+/)||[])[0],10);
  const sq=(v.match(/[MA]/)||[])[0];
  const b=(num&&sq) ? DB.buildings.find(x=>x.num===num&&x.sq===sq) : null;
  if(b){ el.value=''; el.blur(); openDetail(b.id); }
  else el.style.borderColor='#E24B4A';   // introuvable
}
const floorName = f => f===0 ? 'RDC' : f===1 ? '1er' : f+'e';
function progressCard(b, long){
  const done=doneCount(b), n=b.doors.length;
  return `<div class="row">
      <div class="bicon">🏢</div>
      <div><p class="name">${esc(cageLabel(b))}</p><p class="sub">${b.floors} ${long?'étages':'ét.'} · ${n} portes${b.sector?' · '+esc(b.sector):''}</p></div>
      <div class="count"><b>${done}/${n}</b>${long?'<div class="sub">visitées</div>':''}</div>
    </div><div class="bar"><span style="width:${n?done/n*100:0}%"></span></div>`;
}
function renderDetail(){
  const b = curBuilding; if(!b) return;
  const on = sq => b.sq===sq ? 'background:#EF9F27;color:#fff' : '';
  let html = `<button class="back" onclick="setTab('list');render()">← Retour</button>
    <div class="bcard" style="cursor:default">${progressCard(b,true)}</div>
    <div class="bcard" style="cursor:default;margin-top:-2px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#6b7280">
        <span>N° de cage</span>
        <input type="number" min="1" value="${b.num||''}" style="width:72px;padding:8px" onchange="setCageNum('${b.id}',this.value)" />
        <span>Square</span>
        <button class="btn ghost" style="width:auto;margin:0;padding:8px 14px;${on('M')}" onclick="setCageSquare('${b.id}','M')">M</button>
        <button class="btn ghost" style="width:auto;margin:0;padding:8px 14px;${on('A')}" onclick="setCageSquare('${b.id}','A')">A</button>
      </div>
      ${isConflict(b)?`<div style="margin-top:8px;color:#E24B4A;font-size:13px">⚠ Numéro en double dans le square ${SQNAME[b.sq]} — corrige-le (astérisque affiché tant que le doublon existe).</div>`:''}
    </div>`;
  // étages de haut en bas — bouton + à gauche pour ajouter une porte à cet étage
  for(let f=b.floors-1; f>=0; f--){
    html += `<div class="floor">
      <button class="addoor" title="Ajouter une porte à cet étage" onclick="addDoorToFloor('${b.id}',${f})">+</button>
      <div class="lab">${floorName(f)}</div><div class="doors">`;
    b.doors.filter(d=>d.floor===f).forEach(d=>{
      const todo = d.status==='todo';
      html += `<button class="door ${todo?'todo':''}" style="${todo?'':'background:'+colorOf(d.status)}"
                 onclick="openDoor('${b.id}',${d.floor},${d.index})" title="${esc(d.note)}">
                 🚪${d.note?'<span class="note-dot"></span>':''}</button>`;
    });
    html += `</div><button class="delfloor" title="Supprimer cet étage" onclick="deleteFloor('${b.id}',${f})">×</button></div>`;
  }
  html += `<div class="legend">${STATUSES.map(s=>
    `<span><span class="sw" style="background:${s.key==='todo'?'#f4f5f7;border:1px solid #cbd0d6':s.color}"></span>${s.label}</span>`).join('')}</div>
    <label style="display:block;font-size:13px;color:#6b7280;margin:16px 0 4px">Notes</label>
    <textarea id="cageNote" rows="3" placeholder="Digicode, remarques, à repasser…" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;resize:vertical" onchange="setCageNote('${b.id}',this.value)">${esc(b.note)}</textarea>
    <button class="btn ghost" style="margin-top:12px" onclick="addFloor('${b.id}')">+ Ajouter un étage</button>
    <button class="btn ghost" style="margin-top:8px;color:#E24B4A;border-color:#f0b3b3" onclick="deleteBuilding('${b.id}')">Supprimer ce bâtiment</button>`;
  document.getElementById('detail').innerHTML = html;
}

/* ---------- Saisie porte ---------- */
function openDoor(bid,floor,index){
  const b = findB(bid);
  const d = b && b.doors.find(x=>x.floor===floor && x.index===index); if(!d) return;
  curDoor = {b,d};
  document.getElementById('doorTitle').textContent = `${floorName(floor)} · porte ${index+1}`;
  document.getElementById('fNote').value = d.note||'';
  const grid = document.getElementById('statusGrid'); grid.innerHTML='';
  STATUSES.forEach(s=>{
    const btn = document.createElement('button');
    btn.textContent = s.label;
    btn.style.background = s.color;
    if(s.key===d.status) btn.classList.add('sel');
    btn.onclick = ()=> pickDoorStatus(s.key);   // taper un statut = enregistre + revient à la cage
    grid.appendChild(btn);
  });
  openOv('ovDoor');
}
// enregistre le statut (+ note en cours) et revient sur la cage
function pickDoorStatus(status){
  if(!curDoor) return;
  const d = curDoor.d;
  d.status = status;
  d.note = document.getElementById('fNote').value.trim();
  d.date = status==='todo' ? '' : new Date().toISOString().slice(0,10);
  closeOv('ovDoor'); commit();
}
function deleteDoor(){
  if(!curDoor) return;
  if(!confirm('Êtes-vous sûr de vouloir supprimer cette porte ?')) return;
  const {b,d}=curDoor;
  b.doors = b.doors.filter(x=>x!==d);
  // ré-indexe les portes restantes de cet étage (0,1,2…)
  b.doors.filter(x=>x.floor===d.floor).sort((a,c)=>a.index-c.index).forEach((x,i)=>x.index=i);
  curDoor=null; closeOv('ovDoor'); commit();
}

/* ---------- Liste + stats ---------- */
function render(){
  refreshNumbers();   // numérotation à jour avant tout affichage
  const list = document.getElementById('blist');
  list.innerHTML = DB.buildings.length
    ? DB.buildings.map(b=>`<div class="bcard" onclick="openDetail('${b.id}')">${progressCard(b,false)}</div>`).join('')
    : `<div class="empty">Aucun bâtiment.<br>Va sur l'onglet Carte et touche un point pour en ajouter un.</div>`;
  drawMarkers(); renderStats(); updateHeader();
}
function updateHeader(){
  const all = DB.buildings.flatMap(b=>b.doors);
  const done = all.filter(d=>d.status!=='todo').length;
  document.getElementById('hstat').textContent = DB.buildings.length ? `${done}/${all.length} portes` : '';
}
function renderStats(){
  const by = {}; let total=0;
  DB.buildings.forEach(b=>b.doors.forEach(d=>{ by[d.status]=(by[d.status]||0)+1; total++; }));
  const cards = [
    {n:DB.buildings.length, l:'Bâtiments'},
    {n:total, l:'Portes totales'},
    {n:by.interesse||0, l:'Intéressés', c:'#1D9E75'},
    {n:by.refus||0, l:'Refus', c:'#E24B4A'},
    {n:by.absent||0, l:'Absents', c:'#EF9F27'},
    {n:by.todo||0, l:'À faire', c:'#9aa0a6'},
  ];
  document.getElementById('metrics').innerHTML = cards.map(c=>
    `<div class="metric"><div class="n" style="${c.c?'color:'+c.c:''}">${c.n}</div><div class="l">${c.l}</div></div>`).join('');
}

/* ---------- Export / sauvegarde ---------- */
function download(name, text, type){
  const a=document.createElement('a'), url=URL.createObjectURL(new Blob([text],{type}));
  a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
const today = () => new Date().toISOString().slice(0,10);
function exportCSV(){
  const rows = [['Batiment','Secteur','Etage','Porte','Statut','Note','Date','Lat','Lng']];
  DB.buildings.forEach(b=> b.doors.forEach(d=>
    rows.push([b.addr, b.sector||'', floorName(d.floor), d.index+1, labelOf(d.status), d.note||'', d.date||'',
               b.lat!=null?b.lat.toFixed(7):'', b.lng!=null?b.lng.toFixed(7):''])
  ));
  const csv = '﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  download('porte-a-porte-'+today()+'.csv', csv, 'text/csv');
}
// Sauvegarde complète (cages + portes + pastilles retirées) dans un fichier .json
function backupJSON(){
  download('porte-a-porte-sauvegarde-'+today()+'.json', JSON.stringify(DB,null,2), 'application/json');
}
// remet toutes les portes à "À faire" — garde cages, étages, portes et notes
function resetStates(){
  if(!confirm('Remettre toutes les portes à « À faire » ?\nLes cages, étages, portes et notes sont conservés.')) return;
  DB.buildings.forEach(b=>b.doors.forEach(d=>{ d.status='todo'; d.date=''; d.by=''; }));
  save(); render();
}
// Recharge une sauvegarde .json
function restoreJSON(input){
  const file=input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(!d||!Array.isArray(d.buildings)) throw 0;
    if(!d.dismissed) d.dismissed=[];
    DB=d; curBuilding=null; save(); setTab('map'); render();
    alert('Sauvegarde chargée : '+DB.buildings.length+' cage(s).');
  }catch(e){ alert('Fichier invalide.'); } };
  r.readAsText(file);
  input.value='';
}

/* ---------- UI helpers ---------- */
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function openOv(id){ document.getElementById(id).classList.add('show'); }
function closeOv(id){ document.getElementById(id).classList.remove('show'); }
function setTab(tab){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+tab));
  if(tab==='map' && map) setTimeout(()=>frameMap(false),50);   // la carte a pu changer de taille pendant qu'elle était masquée
}
document.querySelectorAll('.tabs button').forEach(b=> b.onclick=()=>{ setTab(b.dataset.tab); render(); });
document.querySelectorAll('.overlay').forEach(o=> o.onclick=e=>{ if(e.target===o) o.classList.remove('show'); });

render();
</script>
</body>
</html>
